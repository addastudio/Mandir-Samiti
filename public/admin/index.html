<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandir Samiti Management | Content Editor</title>
    <!-- Include the script for Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Include the script for Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Automatically point to your Netlify instance for identity when on Vercel
      if (window.location.hostname.includes('vercel.app') || !window.location.hostname.includes('netlify.app')) {
        const netlifyUrl = "https://mandir-bahpura.netlify.app";
        console.log("Cross-platform CMS detected. Pointing Identity to:", netlifyUrl);
        window.netlifyIdentity.on("init", () => {
          if (!window.netlifyIdentity.gotrue.api.apiURL) {
            window.netlifyIdentity.gotrue.api.apiURL = netlifyUrl + "/.netlify/identity";
          }
        });
      }
    </script>
  </body>
</html>
