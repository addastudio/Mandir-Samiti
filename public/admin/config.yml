backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "General Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "site_settings"
        label: "Site Identity"
        file: "content/settings.json"
        fields:
          - { label: "Hindi Site Title", name: "site_title_hi", widget: "string" }
          - { label: "English Site Title", name: "site_title_en", widget: "string" }
          - { label: "Favicon", name: "favicon", widget: "image", required: false }

  - name: "hero"
    label: "Hero Section"
    delete: false
    files:
      - name: "hero_content"
        label: "Hero Content"
        file: "content/hero.json"
        fields:
          - { label: "Hindi Headline", name: "headline_hi", widget: "string" }
          - { label: "English Headline", name: "headline_en", widget: "string" }
          - { label: "Hindi Subtitle", name: "subtitle_hi", widget: "text" }
          - { label: "English Subtitle", name: "subtitle_en", widget: "text" }
          - { label: "Background Video URL", name: "video_url", widget: "string" }
          - { label: "Fallback Image", name: "fallback_image", widget: "image" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About Us"
        file: "content/pages/about.md"
        fields:
          - { label: "Template", name: "template", widget: "hidden", default: "about" }
          - { label: "Hindi History Title", name: "history_title_hi", widget: "string" }
          - { label: "English History Title", name: "history_title_en", widget: "string" }
          - { label: "Hindi History Text", name: "history_hi", widget: "markdown" }
          - { label: "English History Text", name: "history_en", widget: "markdown" }
          - { label: "Hindi Mission Title", name: "mission_title_hi", widget: "string" }
          - { label: "English Mission Title", name: "mission_title_en", widget: "string" }
          - { label: "Hindi Mission Text", name: "mission_hi", widget: "markdown" }
          - { label: "English Mission Text", name: "mission_en", widget: "markdown" }
          - { label: "Featured Image", name: "featured_image", widget: "image" }

  - name: "seva"
    label: "Seva Programs"
    folder: "content/seva"
    create: true
    fields:
      - { label: "Hindi Title", name: "title_hi", widget: "string" }
      - { label: "English Title", name: "title_en", widget: "string" }
      - { label: "Hindi Description", name: "desc_hi", widget: "text" }
      - { label: "English Description", name: "desc_en", widget: "text" }
      - { 
          label: "Icon", 
          name: "icon", 
          widget: "select", 
          options: ["UtensilsCrossed", "HeartHandshake", "BookOpenCheck", "Users", "Hand", "Shield"] 
        }
