backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)

publish_mode: editorial_workflow # Enables a "Drafts" system

media_folder: "public/uploads" # Folder where user uploaded files will go
public_folder: "/uploads" # The src attribute for uploaded media

collections:
  - name: "pages"
    label: "Static Pages"
    files:
      - file: "content/pages/about.md"
        label: "About Us Page"
        name: "about"
        fields:
          - { label: "Template", name: "template", widget: "hidden", default: "about" }
          - { label: "History Title (Hindi)", name: "history_title_hi", widget: "string" }
          - { label: "History Title (English)", name: "history_title_en", widget: "string" }
          - { label: "History Content (Hindi)", name: "history_hi", widget: "markdown" }
          - { label: "History Content (English)", name: "history_en", widget: "markdown" }
          - { label: "Mission Title (Hindi)", name: "mission_title_hi", widget: "string" }
          - { label: "Mission Title (English)", name: "mission_title_en", widget: "string" }
          - { label: "Mission Content (Hindi)", name: "mission_hi", widget: "markdown" }
          - { label: "Mission Content (English)", name: "mission_en", widget: "markdown" }
          - { label: "Featured Image", name: "featured_image", widget: "image" }

      - file: "content/pages/contact.md"
        label: "Contact Information"
        name: "contact"
        fields:
          - { label: "Template", name: "template", widget: "hidden", default: "contact" }
          - { label: "Address (Hindi)", name: "address_hi", widget: "string" }
          - { label: "Address (English)", name: "address_en", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Google Maps Embed URL", name: "map_url", widget: "string" }

  - name: "notices"
    label: "Notices & Announcements"
    folder: "content/notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title (Hindi)", name: "title_hi", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Importance", name: "importance", widget: "select", options: ["normal", "urgent"], default: "normal" }
      - { label: "Content (Hindi)", name: "body_hi", widget: "markdown" }
      - { label: "Content (English)", name: "body_en", widget: "markdown" }

  - name: "events"
    label: "Temple Events"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Event Title (Hindi)", name: "title_hi", widget: "string" }
      - { label: "Event Title (English)", name: "title_en", widget: "string" }
      - { label: "Event Date", name: "date", widget: "datetime" }
      - { label: "Event Image", name: "image", widget: "image" }
      - { label: "Description (Hindi)", name: "body_hi", widget: "markdown" }
      - { label: "Description (English)", name: "body_en", widget: "markdown" }
