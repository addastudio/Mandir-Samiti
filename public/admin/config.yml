backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/home.json"
        label: "Home Page (Hero)"
        name: "home"
        fields:
          - { label: "Hindi Headline", name: "heroHeadline_hi", widget: "string" }
          - { label: "English Headline", name: "heroHeadline_en", widget: "string" }
          - { label: "Hindi Subtitle", name: "heroSubtitle_hi", widget: "text" }
          - { label: "English Subtitle", name: "heroSubtitle_en", widget: "text" }
          - { label: "Hero Video URL", name: "heroVideoUrl", widget: "string", hint: "Direct link to mp4 file" }
          - { label: "Hero Poster Image", name: "heroImage", widget: "image" }
      
      - file: "content/about.json"
        label: "About Us"
        name: "about"
        fields:
          - { label: "Hindi History", name: "history_hi", widget: "markdown" }
          - { label: "English History", name: "history_en", widget: "markdown" }
          - { label: "Hindi Mission", name: "mission_hi", widget: "markdown" }
          - { label: "English Mission", name: "mission_en", widget: "markdown" }
          - { label: "Featured Image", name: "featuredImage", widget: "image" }

      - file: "content/contact.json"
        label: "Contact & Map"
        name: "contact"
        fields:
          - { label: "Hindi Address", name: "address_hi", widget: "string" }
          - { label: "English Address", name: "address_en", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Google Maps Embed URL", name: "mapUrl", widget: "text", hint: "The 'src' attribute from Google Maps iframe" }

  - name: "seva"
    label: "Seva Programs"
    folder: "content/seva"
    create: true
    slug: "{{title_en}}"
    fields:
      - { label: "Hindi Title", name: "title_hi", widget: "string" }
      - { label: "English Title", name: "title_en", widget: "string" }
      - { label: "Hindi Description", name: "description_hi", widget: "text" }
      - { label: "English Description", name: "description_en", widget: "text" }
      - { label: "Icon", name: "icon", widget: "select", options: ["UtensilsCrossed", "HeartHandshake", "BookOpenCheck", "Users", "Hand", "Shield"] }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "General Settings"
        name: "general"
        fields:
          - { label: "Site Title (Hindi)", name: "siteTitle_hi", widget: "string" }
          - { label: "Site Title (English)", name: "siteTitle_en", widget: "string" }
          - { label: "Footer Copyright (Hindi)", name: "footerCopyright_hi", widget: "string" }
          - { label: "Footer Copyright (English)", name: "footerCopyright_en", widget: "string" }
          - { label: "Live Aarti YouTube URL", name: "liveAartiUrl", widget: "string" }
