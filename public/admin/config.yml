backend:
  name: git-gateway
  branch: main
  site_domain: mandirsamiti.netlify.app

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://www.suryamandir.online"
display_url: "https://www.suryamandir.online"
logo_url: "https://www.suryamandir.online/uploads/suryamandir.svg"

publish_mode: editorial_workflow

collections:
  - name: "pages"
    label: "Website Content"
    files:
      - name: "hero"
        label: "Hero Section"
        file: "content/hero.json"
        fields:
          - {label: "Headline (English)", name: "headline_en", widget: "string"}
          - {label: "Headline (Hindi)", name: "headline_hi", widget: "string"}
          - {label: "Subtitle (English)", name: "subtitle_en", widget: "string"}
          - {label: "Subtitle (Hindi)", name: "subtitle_hi", widget: "string"}
          - {label: "Background Video URL", name: "video_url", widget: "string"}
          - {label: "Fallback Hero Image", name: "fallback_image", widget: "image"}
          
      - name: "about"
        label: "About Section"
        file: "content/about.json"
        fields:
          - {label: "History Title (English)", name: "history_title_en", widget: "string"}
          - {label: "History Title (Hindi)", name: "history_title_hi", widget: "string"}
          - {label: "History Content (English)", name: "history_en", widget: "text"}
          - {label: "History Content (Hindi)", name: "history_hi", widget: "text"}
          - {label: "Mission Title (English)", name: "mission_title_en", widget: "string"}
          - {label: "Mission Title (Hindi)", name: "mission_title_hi", widget: "string"}
          - {label: "Mission Content (English)", name: "mission_en", widget: "text"}
          - {label: "Mission Content (Hindi)", name: "mission_hi", widget: "text"}
          - {label: "Featured Heritage Image", name: "featured_image", widget: "image"}

      - name: "settings"
        label: "Global Settings"
        file: "content/settings.json"
        fields:
          - {label: "Site Title (English)", name: "site_title_en", widget: "string"}
          - {label: "Site Title (Hindi)", name: "site_title_hi", widget: "string"}
          - {label: "Site Logo / Favicon", name: "favicon", widget: "image"}

  - name: "seva"
    label: "Seva Programs"
    folder: "content/seva"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title (English)", name: "title_en", widget: "string"}
      - {label: "Title (Hindi)", name: "title_hi", widget: "string"}
      - {label: "Description (English)", name: "desc_en", widget: "text"}
      - {label: "Description (Hindi)", name: "desc_hi", widget: "text"}
      - {label: "Icon", name: "icon", widget: "select", options: ["UtensilsCrossed", "HeartHandshake", "BookOpenCheck", "Users", "Hand", "Shield"]}
