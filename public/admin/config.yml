backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings"
        file: "content/settings.json"
        fields:
          - { label: "Site Title (English)", name: "site_title_en", widget: "string" }
          - { label: "Site Title (Hindi)", name: "site_title_hi", widget: "string" }
          - { label: "Favicon", name: "favicon", widget: "image", choose_url: true }

  - name: "pages"
    label: "Pages"
    files:
      - file: "content/hero.json"
        label: "Hero Section"
        name: "hero"
        fields:
          - { label: "Headline (English)", name: "headline_en", widget: "string" }
          - { label: "Headline (Hindi)", name: "headline_hi", widget: "string" }
          - { label: "Subtitle (English)", name: "subtitle_en", widget: "string" }
          - { label: "Subtitle (Hindi)", name: "subtitle_hi", widget: "string" }
          - { label: "Background Video URL", name: "video_url", widget: "string" }
          - { label: "Fallback Image", name: "fallback_image", widget: "image" }

      - file: "content/about.json"
        label: "About Us Content"
        name: "about"
        fields:
          - { label: "History (English)", name: "history_en", widget: "markdown" }
          - { label: "History (Hindi)", name: "history_hi", widget: "markdown" }
          - { label: "Mission (English)", name: "mission_en", widget: "markdown" }
          - { label: "Mission (Hindi)", name: "mission_hi", widget: "markdown" }
          - { label: "Featured Image", name: "featuredImage", widget: "image" }

      - file: "content/contact.json"
        label: "Contact & Map"
        name: "contact"
        fields:
          - { label: "English Address", name: "enAddress", widget: "string" }
          - { label: "Hindi Address", name: "hiAddress", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Google Maps Embed URL", name: "mapUrl", widget: "string" }

  - name: "seva"
    label: "Seva Programs"
    folder: "content/seva"
    create: true
    slug: "{{title_en}}"
    fields:
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "Title (Hindi)", name: "title_hi", widget: "string" }
      - { label: "Description (English)", name: "desc_en", widget: "text" }
      - { label: "Description (Hindi)", name: "desc_hi", widget: "text" }
      - { label: "Icon", name: "icon", widget: "select", options: ["UtensilsCrossed", "HeartHandshake", "BookOpenCheck", "Users", "Hand", "Shield"] }
