backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)

# This is the domain where Decap CMS will be accessed.
site_url: https://www.suryamandir.online
display_url: https://www.suryamandir.online

media_folder: "public/uploads" # Media files will be stored in the repo under public/uploads
public_folder: "/uploads" # The src attribute for images in the content

collections:
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings"
        file: "content/settings.json"
        fields:
          - { label: "Site Title (EN)", name: "site_title_en", widget: "string" }
          - { label: "Site Title (HI)", name: "site_title_hi", widget: "string" }
          - { label: "Favicon/Logo", name: "favicon", widget: "image" }

  - name: "pages"
    label: "Main Sections"
    delete: false
    editor:
      preview: false
    files:
      - name: "hero"
        label: "Hero Section"
        file: "content/hero.json"
        fields:
          - { label: "Headline (EN)", name: "headline_en", widget: "string" }
          - { label: "Headline (HI)", name: "headline_hi", widget: "string" }
          - { label: "Subtitle (EN)", name: "subtitle_en", widget: "text" }
          - { label: "Subtitle (HI)", name: "subtitle_hi", widget: "text" }
          - { label: "Hero Video URL", name: "video_url", widget: "string" }
          - { label: "Fallback Image", name: "fallback_image", widget: "image" }
      
      - name: "about"
        label: "About Us"
        file: "content/about.json"
        fields:
          - { label: "History Title (EN)", name: "history_title_en", widget: "string" }
          - { label: "History Title (HI)", name: "history_title_hi", widget: "string" }
          - { label: "History Content (EN)", name: "history_en", widget: "markdown" }
          - { label: "History Content (HI)", name: "history_hi", widget: "markdown" }
          - { label: "Mission Title (EN)", name: "mission_title_en", widget: "string" }
          - { label: "Mission Title (HI)", name: "mission_title_hi", widget: "string" }
          - { label: "Mission Content (EN)", name: "mission_en", widget: "markdown" }
          - { label: "Mission Content (HI)", name: "mission_hi", widget: "markdown" }
          - { label: "Featured Image", name: "featured_image", widget: "image" }

  - name: "seva"
    label: "Seva Programs"
    folder: "content/seva"
    create: true
    slug: "{{title_en}}"
    fields:
      - { label: "Title (EN)", name: "title_en", widget: "string" }
      - { label: "Title (HI)", name: "title_hi", widget: "string" }
      - { label: "Description (EN)", name: "desc_en", widget: "text" }
      - { label: "Description (HI)", name: "desc_hi", widget: "text" }
      - { 
          label: "Icon", 
          name: "icon", 
          widget: "select", 
          options: ["UtensilsCrossed", "HeartHandshake", "BookOpenCheck", "Users", "Hand", "Shield"] 
        }
